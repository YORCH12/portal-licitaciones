name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Generate API types
        run: pnpm --filter web generate:api

      - name: Check generated API types
        run: git diff --exit-code -- apps/web/src/lib/api/schema.d.ts

      - name: Type-check
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/api/pyproject.toml
            apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py

      - name: Check OpenAPI contract
        run: git diff --exit-code -- ../../docs/contrato/openapi.json

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Check formatting
        run: uv run ruff format --check app tests scripts

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest
