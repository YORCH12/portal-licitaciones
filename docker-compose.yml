services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitaciones_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitaciones} -d ${POSTGRES_DB:-licitaciones}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
